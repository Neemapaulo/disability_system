name: mkmu_app
description: PamojaMove - Disability-Inclusive Mobility Reporting, Dar es Salaam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Networking & Backend ───────────────────
  supabase_flutter: ^2.8.1
  http: ^1.2.1
  dio: ^5.4.3+1

  # ── State Management & Auth ────────────────
  flutter_riverpod: ^2.5.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2

  # ── Navigation & Deep Links ────────────────
  go_router: ^14.2.7
  app_links: ^6.1.1

  # ── Map & Location ─────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # ── Camera & Images ────────────────────────
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── UI & Animations ────────────────────────
  gap: ^3.0.1
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2

  # ── Utilities ──────────────────────────────
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.4.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
