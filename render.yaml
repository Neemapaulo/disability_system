services:
  - type: web
    runtime: static
    name: mkmu-admin-web
    # Build/serve only the admin dashboard sub-folder of this repo
    rootDir: mkmu-admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Send every path to index.html so client-side routing (React Router) works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Secrets are NOT stored here. sync:false means you set the values in the
    # Render dashboard (Environment tab). Baked into the build at build time.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
